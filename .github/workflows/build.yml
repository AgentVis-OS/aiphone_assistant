name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for publishing a release on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null

      - name: Cache pinned inputs
        uses: actions/cache@v4
        with:
          path: .cache
          key: build-inputs-${{ hashFiles('tools/build-apk.sh', 'tools/fetch-litertlm.sh') }}

      - name: Build APK (with on-device LLM backend)
        run: |
          WITH_LITERTLM=1 tools/build-apk.sh
          mv out/AIPhoneAssistant.apk out/AIPhoneAssistant-litertlm.apk
          (cd out && sha256sum AIPhoneAssistant-litertlm.apk > AIPhoneAssistant-litertlm.apk.sha256)

      - name: Build APK (remote API only)
        run: tools/build-apk.sh

      - name: Package integrator files
        run: |
          tar czf out/aiphoneassistant-integration.tar.gz \
            privapp-permissions-aiphoneassistant.xml sepolicy

      - uses: actions/upload-artifact@v4
        with:
          name: AIPhoneAssistant
          path: |
            out/AIPhoneAssistant.apk
            out/AIPhoneAssistant.apk.sha256
            out/AIPhoneAssistant-litertlm.apk
            out/AIPhoneAssistant-litertlm.apk.sha256
            out/aiphoneassistant-integration.tar.gz

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "Platform-signed with the public AOSP test key; see README (Build the APK without an AOSP tree)." \
            out/AIPhoneAssistant.apk out/AIPhoneAssistant.apk.sha256 \
            out/AIPhoneAssistant-litertlm.apk out/AIPhoneAssistant-litertlm.apk.sha256 \
            out/aiphoneassistant-integration.tar.gz
